<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow - Theo Dõi Deadline (Chung & Riêng)</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #182032;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --chip-bg: #eef2ff;
      --chip-text: #3730a3;
    }

    body.dark {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --chip-bg: #1e3a8a;
      --chip-text: #dbeafe;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 2px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button, select, input {
      font-family: inherit;
      font-size: 0.92rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 8px 12px;
      background: var(--card);
      color: var(--text);
    }

    button {
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s ease;
    }

    button.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    button.primary:hover {
      background: var(--primary-hover);
    }

    button.danger {
      background: transparent;
      color: var(--danger);
      border-color: var(--danger);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      align-items: end;
    }

    .field label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .field input, .field select {
      width: 100%;
    }

    .deadline-list {
      display: grid;
      gap: 10px;
    }

    .item {
      border: 1px solid var(--border);
      border-left: 5px solid var(--success);
      border-radius: 10px;
      padding: 12px 14px;
      background: var(--card);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item.soon { border-left-color: var(--warning); }
    .item.overdue { border-left-color: var(--danger); }

    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      flex-wrap: wrap;
    }

    .badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .badge {
      font-size: 0.76rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--chip-bg);
      color: var(--chip-text);
      font-weight: 600;
    }

    .meta {
      font-size: 0.84rem;
      color: var(--muted);
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .progress-row input[type="range"] {
      flex: 1;
      min-width: 140px;
      padding: 0;
      border: none;
      background: transparent;
    }

    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .note {
      font-size: 0.84rem;
      color: var(--muted);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>TaskFlow - Theo Dõi Deadline</h1>
        <div class="subtitle">Dữ liệu <b>Riêng</b> lưu trên máy cá nhân • Dữ liệu <b>Chung</b> xuất/nhập file .json để gộp cho nhóm</div>
      </div>
      <div class="toolbar">
        <button id="exportSharedBtn">Xuất Chung (.json)</button>
        <button id="importSharedBtn">Nhập Chung (.json)</button>
        <input type="file" id="importSharedFile" accept="application/json" hidden />
        <button id="themeBtn">Sáng / Tối</button>
      </div>
    </header>

    <div class="card">
      <form id="deadlineForm" class="form-grid">
        <div class="field">
          <label for="titleInput">Tên deadline *</label>
          <input id="titleInput" type="text" required placeholder="Ví dụ: Nộp báo cáo tuần" />
        </div>
        <div class="field">
          <label for="dueInput">Hạn chót *</label>
          <input id="dueInput" type="datetime-local" required />
        </div>
        <div class="field">
          <label for="scopeSelect">Phạm vi lưu trữ</label>
          <select id="scopeSelect">
            <option value="personal">Riêng của tôi (máy này)</option>
            <option value="shared">Chung cả nhóm (xuất/nhập .json)</option>
          </select>
        </div>
        <div class="field">
          <label for="prioritySelect">Mức ưu tiên</label>
          <select id="prioritySelect">
            <option value="Cao">Cao</option>
            <option value="Trung bình" selected>Trung bình</option>
            <option value="Thấp">Thấp</option>
          </select>
        </div>
        <div class="field">
          <button type="submit" class="primary" style="width: 100%;">+ Thêm deadline</button>
        </div>
      </form>
      <div class="note">Mẹo: Khi bấm <b>Nhập Chung (.json)</b>, các mục trùng mã sẽ được cập nhật và mục mới sẽ được gộp thêm vào danh sách <b>Chung</b>; danh sách <b>Riêng</b> của bạn được giữ nguyên.</div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="all">Tất cả</button>
      <button class="tab" data-tab="shared">Danh sách Chung</button>
      <button class="tab" data-tab="personal">Danh sách Riêng</button>
    </div>

    <div id="deadlineList" class="deadline-list"></div>
  </div>

  <script>
    const SHARED_KEY = 'taskflow_deadlines_shared_v1';
    const PERSONAL_KEY = 'taskflow_deadlines_personal_v1';
    const THEME_KEY = 'taskflow_theme_v1';

    let currentTab = 'all';

    function loadList(key) {
      try {
        return JSON.parse(localStorage.getItem(key)) || [];
      } catch {
        return [];
      }
    }

    function saveList(key, list) {
      localStorage.setItem(key, JSON.stringify(list));
    }

    function getStatusClass(dueStr, progress) {
      if (progress >= 100) return '';
      const diffHours = (new Date(dueStr).getTime() - Date.now()) / (1000 * 60 * 60);
      if (diffHours < 0) return 'overdue';
      if (diffHours <= 48) return 'soon';
      return '';
    }

    function formatRemaining(dueStr, progress) {
      if (progress >= 100) return 'Đã hoàn thành';
      const diffMs = new Date(dueStr).getTime() - Date.now();
      const absHours = Math.round(Math.abs(diffMs) / (1000 * 60 * 60));
      const days = Math.floor(absHours / 24);
      const hours = absHours % 24;
      const text = days > 0 ? `${days} ngày ${hours} giờ` : `${hours} giờ`;
      return diffMs < 0 ? `Quá hạn ${text}` : `Còn ${text}`;
    }

    function render() {
      const shared = loadList(SHARED_KEY).map(x => ({ ...x, scope: 'shared' }));
      const personal = loadList(PERSONAL_KEY).map(x => ({ ...x, scope: 'personal' }));

      let items = [];
      if (currentTab === 'shared') items = shared;
      else if (currentTab === 'personal') items = personal;
      else items = [...shared, ...personal];

      items.sort((a, b) => new Date(a.due) - new Date(b.due));

      const container = document.getElementById('deadlineList');
      if (!items.length) {
        container.innerHTML = '<div class="card meta">Chưa có deadline nào trong mục này.</div>';
        return;
      }

      container.innerHTML = items.map(item => {
        const statusClass = getStatusClass(item.due, item.progress);
        const scopeLabel = item.scope === 'shared' ? 'CHUNG' : 'RIÊNG';
        return `
          <div class="item ${statusClass}">
            <div class="item-top">
              <div>
                <strong>${escapeHtml(item.title)}</strong>
                <div class="meta">Hạn: ${new Date(item.due).toLocaleString('vi-VN')} • ${formatRemaining(item.due, item.progress)}</div>
              </div>
              <div class="badges">
                <span class="badge">${scopeLabel}</span>
                <span class="badge">Ưu tiên: ${escapeHtml(item.priority)}</span>
              </div>
            </div>
            <div class="progress-row">
              <input type="range" min="0" max="100" value="${item.progress}" onchange="updateProgress('${item.scope}', '${item.id}', this.value)" />
              <strong>${item.progress}%</strong>
              <div class="actions">
                <button onclick="updateProgress('${item.scope}', '${item.id}', 100)">Hoàn tất</button>
                <button class="danger" onclick="deleteItem('${item.scope}', '${item.id}')">Xoá</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    window.updateProgress = function(scope, id, val) {
      const key = scope === 'shared' ? SHARED_KEY : PERSONAL_KEY;
      const list = loadList(key).map(item =>
        item.id === id ? { ...item, progress: Number(val) } : item
      );
      saveList(key, list);
      render();
    };

    window.deleteItem = function(scope, id) {
      const key = scope === 'shared' ? SHARED_KEY : PERSONAL_KEY;
      const list = loadList(key).filter(item => item.id !== id);
      saveList(key, list);
      render();
    };

    document.getElementById('deadlineForm').addEventListener('submit', e => {
      e.preventDefault();
      const title = document.getElementById('titleInput').value.trim();
      const due = document.getElementById('dueInput').value;
      const scope = document.getElementById('scopeSelect').value;
      const priority = document.getElementById('prioritySelect').value;
      if (!title || !due) return;

      const key = scope === 'shared' ? SHARED_KEY : PERSONAL_KEY;
      const list = loadList(key);
      list.push({
        id: String(Date.now()) + '_' + Math.random().toString(36).slice(2, 6),
        title,
        due,
        priority,
        progress: 0
      });
      saveList(key, list);
      e.target.reset();
      document.getElementById('scopeSelect').value = scope;
      render();
    });

    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        render();
      });
    });

    document.getElementById('exportSharedBtn').addEventListener('click', () => {
      const data = loadList(SHARED_KEY);
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'deadlines-chung.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    const fileInput = document.getElementById('importSharedFile');
    document.getElementById('importSharedBtn').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;

      try {
        const parsed = JSON.parse(await file.text());

        if (!Array.isArray(parsed)) {
          throw new Error('Danh sách JSON phải là một mảng');
        }

        const validItems = parsed.filter(item =>
          item &&
          typeof item.title === 'string' &&
          item.title.trim() &&
          typeof item.due === 'string' &&
          !Number.isNaN(new Date(item.due).getTime()) &&
          typeof item.priority === 'string'
        ).map(item => ({
          id: typeof item.id === 'string' && item.id
            ? item.id
            : String(Date.now()) + '_' + Math.random().toString(36).slice(2, 6),
          title: item.title.trim(),
          due: item.due,
          priority: item.priority,
          progress: Math.min(100, Math.max(0, Number(item.progress) || 0))
        }));

        if (validItems.length !== parsed.length) {
          throw new Error('File có dữ liệu không hợp lệ');
        }

        const current = loadList(SHARED_KEY);
        const merged = new Map();

        current.forEach(item => merged.set(item.id, item));
        validItems.forEach(item => merged.set(item.id, item));

        saveList(SHARED_KEY, [...merged.values()]);
        render();
        alert('Đã nhập danh sách Chung thành công!');
      } catch (error) {
        alert(error.message || 'File .json không hợp lệ.');
      } finally {
        e.target.value = '';
      }
    });

    const themeBtn = document.getElementById('themeBtn');
    if (localStorage.getItem(THEME_KEY) === 'dark') document.body.classList.add('dark');
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      localStorage.setItem(THEME_KEY, document.body.classList.contains('dark') ? 'dark' : 'light');
    });

    render();
  </script>
</body>
</html>
